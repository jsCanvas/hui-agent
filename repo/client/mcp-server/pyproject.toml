[project]
name = "hui-mcp-server"
version = "0.1.1"
description = "HuiAgent Desktop MCP server — screen capture, input, Edge TTS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.6",
  "edge-tts>=6.1",
  "mss>=9.0",
  "pillow>=10.0",
  "numpy>=1.26",
  "httpx>=0.27",
  "SpeechRecognition>=3.10.0",
  "PyAudio>=0.2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gguf = ["llama-cpp-python>=0.3.0"]

[project.scripts]
hui-mcp-server = "hui_mcp.__main__:main"
hui-tts-proxy = "hui_mcp.voice.tts_proxy:main"
hui-socket-bridge = "hui_mcp.socket_bridge:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hui_mcp*"]
